<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242923" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Shared tools with your neighbors – no login needed.">
<title>NeighborTools</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232E52D0'/%3E%3Ctext y='.9em' font-size='70' x='50%25' text-anchor='middle' fill='white'%3E🔧%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#E8EBE4; --card:#FFFFFF; --ink:#20251F; --muted:#67705F; --line:#D3D8CB;
  --accent:#2E52D0; --accent-press:#2543AE; --accent-tint:#E7ECFB;
  --home:#256B43; --home-tint:#E1F0E6; --out:#9A5300; --out-tint:#FBEBD3;
  --danger:#B23A26; --headbg:#242923; --headink:#F4F6F1;
  --shadow:0 1px 2px rgba(32,37,31,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141714; --card:#1C201B; --ink:#E8EBE4; --muted:#9AA392; --line:#2E342E;
    --accent:#5B7CFF; --accent-press:#4A6AE0; --accent-tint:#1A2240;
    --home:#3D9B68; --home-tint:#1A2E22; --out:#D4923A; --out-tint:#2E2418;
    --danger:#E05A48; --headbg:#0E100E; --headink:#F4F6F1;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
[hidden]{display:none !important}

.vb-center{min-height:100vh; display:flex; align-items:center; justify-content:center}

/* Header – pegboard style panel */
.vb-head{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:14px 16px; background-color:var(--headbg);
  background-image:radial-gradient(circle, rgba(244,246,241,.16) 1.5px, transparent 1.6px);
  background-size:17px 17px; color:var(--headink)}
.vb-head-tall{flex-direction:column; align-items:flex-start; gap:6px; padding:26px 20px 22px; position:static}
.vb-logo{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; font-size:22px;
  letter-spacing:.06em; display:flex; align-items:center; gap:9px; color:var(--headink)}
.vb-logomark{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
  border-radius:7px; background:var(--accent); color:#fff; flex:0 0 auto}
.vb-tagline{color:rgba(244,246,241,.75); font-size:13.5px}
.vb-headright{display:flex; align-items:center; gap:8px}
.vb-mechip{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px;
  background:rgba(244,246,241,.12); color:var(--headink); font-weight:600; font-size:13px;
  border:1px solid rgba(244,246,241,.22); max-width:150px}
.vb-mechip .vb-navn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vb-onhead{color:var(--headink)}
.vb-onhead:hover{background:rgba(244,246,241,.14)}
.vb-spin{width:14px; height:14px; border-radius:50%; border:2px solid rgba(244,246,241,.35);
  border-top-color:var(--headink); animation:vbspin .7s linear infinite}
@keyframes vbspin{to{transform:rotate(360deg)}}
.vb-pulse{animation:vbpulse 1.2s ease-in-out infinite}
@keyframes vbpulse{50%{opacity:.45}}
.vb-logo-moerk{color:var(--ink)}
.vb-logo-moerk .vb-logomark{background:var(--accent)}

.vb-banner{font-size:12.5px; padding:7px 16px; text-align:center}
.vb-banner.test{background:var(--accent-tint); color:var(--accent)}
.vb-banner.minne{background:var(--out-tint); color:var(--out)}

.vb-main{max-width:540px; margin:0 auto; padding:14px 14px calc(120px + env(safe-area-inset-bottom))}

.vb-stats{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
  letter-spacing:.02em; margin:2px 2px 10px}
.vb-search{margin-bottom:10px}

.vb-chips{display:flex; gap:7px; overflow-x:auto; padding:8px 0 10px; margin:0 -14px 4px; padding-left:14px; padding-right:14px;
  position:sticky; top:56px; z-index:15; background:var(--bg); scrollbar-width:none}
.vb-chips::-webkit-scrollbar{display:none}
.vb-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; padding:9px 14px;
  border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-size:13.5px; font-weight:600;
  color:var(--muted); white-space:nowrap; transition:background .12s,color .12s,border-color .12s}
/* Selected chip inverts against the page, so it stays readable in both themes
   (--ink is near-white in dark mode, where a hardcoded white would vanish) */
.vb-chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.vb-chip.on .vb-sw{box-shadow:0 0 0 1.5px var(--bg)}
.vb-chipdiv{flex:0 0 1px; background:var(--line); align-self:stretch; margin:2px 3px}

.vb-list{display:flex; flex-direction:column; gap:10px}
.vb-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px;
  box-shadow:var(--shadow)}
.vb-toolimg{width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--line); flex:0 0 auto}
.vb-toolrow{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.vb-toolleft{display:flex; gap:12px; align-items:flex-start; min-width:0; flex:1}
.vb-toolname{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; min-width:0}
.vb-you{color:var(--muted); font-weight:500; font-size:13px}
.vb-type{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:700; font-size:11.5px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line);
  border-radius:6px; padding:3px 7px; white-space:nowrap; margin-top:1px}
.vb-ownerline{font-size:13px; color:var(--muted); margin-top:5px; display:flex; align-items:center; gap:6px}
.vb-sw{display:inline-block; width:10px; height:10px; border-radius:3px; flex:0 0 auto}

/* Status tag – looks like a physical loan tag with a hole */
.vb-tagrow{margin-top:9px}
.vb-tagg{position:relative; display:inline-flex; align-items:center; font-size:12.5px; font-weight:600;
  padding:5px 11px 5px 22px; border-radius:5px 999px 999px 5px}
.vb-tagg::before{content:""; position:absolute; left:8px; top:50%; transform:translateY(-50%);
  width:7px; height:7px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 1.5px currentColor}
.vb-tagg.hjemme{background:var(--home-tint); color:var(--home)}
.vb-tagg.ute{background:var(--out-tint); color:var(--out)}

.vb-notes{font-size:13px; color:var(--muted); margin-top:8px; overflow-wrap:anywhere}
.vb-addr{font-size:13px; color:var(--muted); margin-top:5px; display:flex; align-items:center; gap:5px}
.vb-counts{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:8px}

.vb-toolactions{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px}

.vb-btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
  padding:14px 18px; border-radius:12px; font-weight:700; font-size:15px;
  transition:background .12s, transform .05s}
.vb-btn:active{transform:scale(.985)}
.vb-btn:disabled{opacity:.45; cursor:default}
.vb-primary{background:var(--accent); color:#fff}
.vb-primary:not(:disabled):hover{background:var(--accent-press)}
.vb-ghost{background:transparent; border:1.5px dashed var(--line); color:var(--muted)}
.vb-return{background:var(--home-tint); color:var(--home)}
.vb-dangertxt{background:transparent; color:var(--danger); font-weight:600}
.vb-dangertxt.bekreft{background:var(--danger); color:#fff}
.vb-small{width:auto; padding:11px 16px; font-size:14px}
.vb-iconbtn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:9px; color:var(--muted); flex:0 0 auto}
.vb-iconbtn:hover{background:rgba(32,37,31,.06)}

.vb-inp{width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--card); font:inherit; color:var(--ink)}
.vb-inp:focus{outline:none; border-color:var(--accent)}
textarea.vb-inp{resize:vertical}
select.vb-inp{appearance:auto}
.vb-field{display:block; margin-bottom:12px}
.vb-lbl{display:block; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); margin-bottom:5px}

/* empty state – refined below */

/* Bottom nav + floating action button */
.vb-nav{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; gap:4px;
  background:var(--card); border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.vb-tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0; width:104px;
  border-radius:10px; color:var(--muted)}
.vb-tab span{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:700; font-size:11.5px;
  letter-spacing:.1em; text-transform:uppercase}
.vb-tab.on{color:var(--accent); background:var(--accent-tint)}
.vb-fab{position:fixed; right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:21;
  display:inline-flex; align-items:center; gap:7px; padding:13px 18px; border-radius:999px;
  background:var(--accent); color:#fff; font-weight:700; font-size:14.5px;
  box-shadow:0 6px 18px rgba(46,82,208,.38)}
.vb-fab:hover{background:var(--accent-press)}

/* Bottom sheet / modal forms */
.vb-overlay{position:fixed; inset:0; z-index:40; background:rgba(24,27,23,.5); display:flex;
  align-items:flex-end; justify-content:center; animation:vbfade .15s ease-out}
.vb-sheet{background:var(--card); width:100%; max-width:540px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  animation:vbup .22s ease-out}
@media (min-width:640px){
  .vb-overlay{align-items:center; padding:24px}
  .vb-sheet{border-radius:20px}
}
@keyframes vbfade{from{opacity:0}}
@keyframes vbup{from{transform:translateY(24px); opacity:.6}}
.vb-sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px}
.vb-h2{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; font-size:21px;
  letter-spacing:.03em; text-transform:uppercase; overflow-wrap:anywhere}
.vb-sheet-actions{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.vb-pickgrid{display:flex; flex-direction:column; gap:8px}
.vb-pick{display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:10px; text-align:left;
  padding:12px 13px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); width:100%}
.vb-pick:hover{border-color:var(--accent); background:var(--accent-tint)}
.vb-pick-name{font-weight:700}
.vb-pick-addr{grid-column:2; font-size:12.5px; color:var(--muted)}

/* Setup (first run) */
.vb-setuprow{display:flex; gap:9px; align-items:flex-start; margin-bottom:12px}
.vb-setupnum{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; font-size:15px;
  color:var(--muted); width:24px; height:24px; border:1.5px solid var(--line); border-radius:8px;
  display:flex; align-items:center; justify-content:center; margin-top:8px; flex:0 0 auto}
.vb-setupfields{flex:1; display:flex; flex-direction:column; gap:7px}
.vb-finetext{font-size:12px; color:var(--muted); margin-top:12px}

/* Activity log */
.vb-loglist{display:flex; flex-direction:column; gap:7px}
.vb-logrow{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  background:var(--card); border:1px solid var(--line); border-left-width:4px; border-radius:10px;
  padding:10px 12px; font-size:13.5px}
.vb-logrow.t-laan{border-left-color:var(--out)}
.vb-logrow.t-retur{border-left-color:var(--home)}
.vb-logrow.t-ny{border-left-color:var(--accent)}
.vb-logrow.t-slett{border-left-color:var(--danger)}
.vb-logrow.t-pers{border-left-color:var(--line)}
.vb-logtext{overflow-wrap:anywhere}
.vb-logdate{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); white-space:nowrap}

.vb-muted{color:var(--muted); font-size:13.5px}
.vb-mb{margin-bottom:12px}
.vb-mt{margin-top:12px}
.vb-toast{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom)); z-index:50; background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:600; max-width:90vw; text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25); animation:vbup .2s ease-out}

.vb-card{transition:border-color .12s, box-shadow .12s}
.vb-card:hover{border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.vb-empty{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
  color:var(--muted); padding:48px 24px; border:1.5px dashed var(--line); border-radius:16px; margin-top:6px}
.vb-empty b{color:var(--ink); font-size:16px}
.vb-empty-ico{width:56px; height:56px; border-radius:16px; background:var(--accent-tint); color:var(--accent);
  display:flex; align-items:center; justify-content:center}
.vb-skeleton{background:linear-gradient(90deg, var(--line) 25%, var(--card) 50%, var(--line) 75%);
  background-size:200% 100%; animation:vbskel 1.2s ease-in-out infinite; border-radius:10px; height:88px; margin-bottom:10px}
@keyframes vbskel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.vb-toast[role="status"]{pointer-events:none}
.vb-btn[aria-busy="true"]{opacity:.55; pointer-events:none}
.vb-overlay{overscroll-behavior:contain}
.vb-sheet:focus{outline:none}
.vb-sheet-head h2{margin:0}


/* Store-like grid on larger screens */
@media (min-width: 640px){
  .vb-main{max-width:920px}
  .vb-list.grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px}
}
@media (min-width: 960px){
  .vb-main{max-width:1100px}
  .vb-list.grid{grid-template-columns:repeat(3, 1fr)}
}
.vb-list.grid .vb-card{display:flex; flex-direction:column; height:100%}
.vb-list.grid .vb-toolactions{margin-top:auto}

.vb-tagg.lenge{background:#FDE8E6; color:var(--danger)}
@media (prefers-color-scheme: dark){
  .vb-tagg.lenge{background:#3A1F1C; color:var(--danger)}
}

.vb-check{
  width:22px; height:22px; border-radius:6px; border:2px solid var(--line);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  margin-top:2px; background:var(--card)
}
.vb-check.on{background:var(--accent); border-color:var(--accent); color:#fff}
.vb-bulk{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(72px + env(safe-area-inset-bottom)); z-index:22;
  display:flex; gap:8px; align-items:center; padding:10px 12px;
  background:var(--ink); color:var(--bg); border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.28); max-width:94vw
}
.vb-bulk .vb-btn{width:auto; padding:10px 14px; font-size:13.5px}
.vb-bulk .vb-ghost{color:var(--bg); border-color:color-mix(in srgb, var(--bg) 40%, transparent)}
.vb-bulk-count{font-weight:700; font-size:13.5px; white-space:nowrap; padding:0 4px}

.vb-hist{margin-top:10px; border-top:1px solid var(--line); padding-top:10px}
.vb-hist h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px}
.vb-hist-row{font-size:13px; color:var(--muted); padding:4px 0; display:flex; justify-content:space-between; gap:8px}
.vb-pinbox{max-width:360px; margin:0 auto; padding:24px 18px}
/* Language switch: both languages visible, the active one filled in */
.vb-langsw{display:inline-flex; align-items:stretch; border-radius:999px; overflow:hidden;
  border:1px solid rgba(244,246,241,.3); flex:0 0 auto}
.vb-langsw button{padding:5px 10px; font-size:11px; font-weight:800; letter-spacing:.08em;
  color:rgba(244,246,241,.72); line-height:1.5; transition:background .12s, color .12s}
.vb-langsw button:hover{background:rgba(244,246,241,.14); color:var(--headink)}
.vb-langsw button.on{background:var(--headink); color:var(--headbg)}
.vb-langsw button.on:hover{background:var(--headink); color:var(--headbg)}
/* Variant for use on a light card instead of the dark header */
.vb-langsw.kort{border-color:var(--line)}
.vb-langsw.kort button{color:var(--muted)}
.vb-langsw.kort button:hover{background:var(--bg); color:var(--ink)}
.vb-langsw.kort button.on{background:var(--ink); color:var(--card)}
.vb-langsw.kort button.on:hover{background:var(--ink); color:var(--card)}

/* Requests ("etterlysninger") */
.vb-sechead{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; font-size:15px;
  letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:18px 2px 10px}
.vb-req-meta{font-size:12.5px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:6px;
  flex-wrap:wrap}
.vb-resp{border-top:1px solid var(--line); padding:9px 0 4px; font-size:13px; color:var(--muted)}
.vb-resp b{color:var(--ink)}
.vb-hoodtoggle{display:flex; gap:11px; align-items:flex-start; cursor:pointer; margin-bottom:4px}
.vb-hoodtoggle input{width:19px; height:19px; margin-top:2px; accent-color:var(--accent); flex:0 0 auto}
.vb-radios{display:flex; flex-direction:column; gap:8px; padding:2px 0}
.vb-radios label{display:flex; align-items:center; gap:9px; font-weight:600; cursor:pointer}
.vb-radios input{width:17px; height:17px; accent-color:var(--accent); flex:0 0 auto}
.vb-tab{position:relative}
.vb-tabbadge{position:absolute; top:2px; right:16px; min-width:17px; height:17px; padding:0 4px;
  border-radius:999px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center}
.vb-logrow.t-ettersp{border-left-color:var(--accent)}
.vb-resp-tool{font-size:12.5px; color:var(--ink); margin-top:4px; display:flex; align-items:center; gap:5px}

/* Due dates, queue and outside loans */
.vb-tagrow{display:flex; flex-wrap:wrap; gap:6px}
.vb-tagg.frist{background:var(--accent-tint); color:var(--accent)}
.vb-tagg.ekstern{background:var(--line); color:var(--muted)}
.vb-queue{font-size:12.5px; color:var(--muted); margin-top:8px; display:flex; align-items:center;
  gap:5px; flex-wrap:wrap}
.vb-remind{display:flex; align-items:center; gap:9px; width:100%; text-align:left; margin-bottom:10px;
  padding:11px 13px; border-radius:12px; background:var(--out-tint); color:var(--out);
  border:1px solid transparent; font-size:13.5px; font-weight:600}
.vb-remind:hover{border-color:currentColor}
.vb-remind span:first-of-type{flex:1}
.vb-remind-link{text-decoration:underline; white-space:nowrap; font-weight:700}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div id="app">
  <div class="vb-center">
    <div style="text-align:center">
      <div class="vb-logo vb-logo-moerk vb-pulse" style="justify-content:center"><span class="vb-logomark">🔧</span>NEIGHBORTOOLS</div>
      <p class="vb-muted" style="margin-top:14px">Loading …</p>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   NeighborTools – simple shared tool inventory
   ============================================================
   WHITELABEL / RENAME HERE:
   Change only the values below – logo, title and tagline update automatically.
   ============================================================ */
var CONFIG = {
  name: 'NeighborTools',          // Shown in logo and headings
  shortName: 'NeighborTools',     // Short variant
  tagline: 'Shared tools with your neighbors – no login needed.',
  storageKey: 'neighbortools',    // Internal storage prefix (do not change after first use)
  autoLang: true,                 // Match the browser's language on first visit
  defaultLang: 'en',              // Fallback when autoLang finds no match (or is off)
  longLoanDays: 14,               // highlight loans older than this
  // Optional default PIN (also settable in app setup / settings). Leave '' for no PIN.
  pin: ''
};

/* UI strings – Norwegian + English */
var I18N = {

/* t() with {0}/{1} placeholders filled in */
function tf(key){
  var s = t(key);
  for(var i = 1; i < arguments.length; i++)
    s = s.replace('{' + (i - 1) + '}', arguments[i]);
  return s;
}
function t(key){
  var lang = (st && st.lang) || CONFIG.defaultLang || 'en';
  return (I18N[lang] && I18N[lang][key]) || (I18N.en[key]) || key;
}

/* Language for a first-time visitor: the first of the browser's preferred
   languages we actually speak, otherwise CONFIG.defaultLang. Only ever a
   default – an explicit NO/EN choice is stored and always wins. */
function fallbackSprak(){
  return CONFIG.defaultLang === 'nb' ? 'nb' : 'en';
}
function oppdagSprak(){
  if(!CONFIG.autoLang) return fallbackSprak();
  try{
    var liste = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage];
    for(var i = 0; i < liste.length; i++){
      // Compare the language subtag only: 'nb-NO' -> 'nb', 'en-GB' -> 'en'
      var kode = String(liste[i] || '').toLowerCase().split('-')[0];
      if(kode === 'nb' || kode === 'nn' || kode === 'no') return 'nb';
      if(kode === 'en') return 'en';
    }
  }catch(e){}
  return fallbackSprak();
}

/* ---------- Storage (server / artifact / memory) ----------
   On a server, every tool-sharing group is its own store and the PIN is the
   key to it. gid + pin are kept on this device so you stay logged in. */
var Lager = { mode:'minne', mem:null, me:null, gid:null, pin:'' };

var SESSION_KEY = CONFIG.storageKey + ':sess';
function readSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; }
}
function writeSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({gid:Lager.gid, pin:Lager.pin})); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function api(path, options, msTimeout){
  return new Promise(function(res){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, msTimeout || 8000);
    var o = options || {};
    o.cache = 'no-store';
    o.signal = ctl.signal;
    fetch(path, o).then(function(r){
      clearTimeout(timer);
      r.json().then(function(j){ res({ok:r.ok, status:r.status, body:j}); })
              .catch(function(){ res({ok:r.ok, status:r.status, body:null}); });
    }).catch(function(){ clearTimeout(timer); res({ok:false, status:0, body:null}); });
  });
}
function pinHeader(extra){
  var h = extra || {};
  // URI-encoded so special characters (and æøå) are legal in an HTTP header
  if(Lager.pin) h['X-Pin'] = encodeURIComponent(Lager.pin);
  return h;
}
function groupUrl(){ return 'api/groups/' + Lager.gid + '/data'; }
function setGroup(gid, pin){
  Lager.gid = gid; Lager.pin = pin || '';
  writeSession();
}
function leaveGroup(){
  Lager.gid = null; Lager.pin = ''; Lager.me = null;
  clearSession();
}

async function initLager(){
  var probe = await api('api/groups', null, 2500);
  if(probe.ok && probe.body && Array.isArray(probe.body.groups)){
    Lager.mode = 'server';
    var s = readSession();
    if(s && s.gid){
      Lager.gid = s.gid; Lager.pin = s.pin || '';
      var r = await api(groupUrl(), {headers: pinHeader()});
      if(r.ok && r.body && r.body.data) return r.body.data;
      leaveGroup();   // group deleted or PIN changed – back to the front page
    }
    return null;
  }
  if(window.storage){
    Lager.mode = 'artifact';
    try{
      var m = await window.storage.get(MEKEY, false);
      if(m) Lager.me = JSON.parse(m.value);
    }catch(e){}
    try{
      var r = await window.storage.get(KEY, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  Lager.mode = 'minne';
  return null;
}

async function hentData(){
  if(Lager.mode === 'server'){
    if(!Lager.gid) return null;
    var s = await api(groupUrl(), {headers: pinHeader()});
    if(s.ok && s.body) return s.body.data;
    if(s.status === 401 || s.status === 404) return null; // access lost
    return undefined;                                     // could not reach server
  }
  if(Lager.mode === 'artifact'){
    try{
      var r = await window.storage.get(KEY, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  return Lager.mem;
}

async function lagreData(d, basertRev){
  if(Lager.mode === 'server'){
    var r = await fetch(groupUrl(), {
      method:'POST',
      headers: pinHeader({'Content-Type':'application/json'}),
      body: JSON.stringify({rev: basertRev || 0, data: d})
    });
    if(r.status === 409){
      var j409 = await r.json();
      var e = new Error('utdatert'); e.stale = true; e.data = j409.data; throw e;
    }
    if(!r.ok) throw new Error('serverfeil');
    var j = await r.json();
    return j.data;
  }
  d.rev = (basertRev || 0) + 1;
  if(Lager.mode === 'artifact'){
    await window.storage.set(KEY, JSON.stringify(d), true);
    return d;
  }
  Lager.mem = d;
  return d;
}

/* One "who am I" per group, so the same device can be used in several groups */
function meKey(){ return Lager.gid ? MEKEY + ':' + Lager.gid : MEKEY; }
function hentMeg(){
  if(Lager.mode === 'server'){
    // Per group only – never fall back across groups
    try{ return localStorage.getItem(meKey()); }catch(e){ return null; }
  }
  return Lager.me;
}
function settMeg(id){
  Lager.me = id;
  if(Lager.mode === 'server'){ try{ localStorage.setItem(meKey(), id); }catch(e){} }
  if(Lager.mode === 'artifact'){
    try{ window.storage.set(MEKEY, JSON.stringify(id), false); }catch(e){}
  }
}


/* ---------- PIN / session ----------
   On a server the PIN is checked server-side (see the front page). The local
   gate below is only used in artifact / memory mode, where there is no server. */
function pinKey(){ return CONFIG.storageKey + ':pinok'; }
function getPin(){
  if(CONFIG.pin) return String(CONFIG.pin);

}

  if(st.pinOk) return true;
  try{ return sessionStorage.getItem(pinKey()) === '1'; }catch(e){ return false; }
}

/* ---------- State ---------- */
var st = {
  klar:false, data:null, visning:'verktoy', filter:'alle', sok:'',
  modal:null, lagrer:false, oppsett:null, bekreft:null,
  lang: oppdagSprak(),   // a stored choice replaces this during boot
  selected: {},
  pinOk: false,
  landing: false,     // front page: open an existing group or start a new one
  landingError: '',   // message shown on the front page / setup screen
  setupPin: '',       // PIN typed in the setup wizard (kept across re-renders)
  req: {mine: [], nearby: []},  // neighborhood requests from the server
  toast: '', toastTil: 0        // current toast message and when it expires
};
var toastTimer = null;
var TOAST_MS = 2600;

/* The message lives in state, not in the DOM: every render replaces #app,
   and a re-render right after a save (see endre) would otherwise wipe it. */
function toast(m){
  st.toast = m;
  st.toastTil = Date.now() + TOAST_MS;
  visToast();
}
function visToast(){
  var el = $('#toast');
  if(!el) return;
  var igjen = st.toast ? st.toastTil - Date.now() : 0;
  if(igjen <= 0){
    st.toast = '';
    el.hidden = true;
    return;
  }
  el.textContent = st.toast;
  el.hidden = false;
  el.setAttribute('role', 'status');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    st.toast = '';
    var e = $('#toast');
    if(e) e.hidden = true;
  }, igjen);
}
function visLagrer(paa){
  var s = $('#spin'); if(s) s.hidden = !paa;
}

function leggLogg(d, e){
  d.log = d.log || [];
  e.id = uid(); e.date = naaISO();
  d.log.push(e);
}

/* Read-modify-write with automatic retry on concurrent save */
async function endre(fn, melding){
  st.lagrer = true; visLagrer(true);
  try{
    for(var i = 0; i < 3; i++){
      var basis = await hentData();
      if(basis === undefined || basis === null) basis = st.data;
      var ny = fn(kopi(basis));
      if(!ny || typeof ny !== 'object') throw new Error('invalid');
      ny.log = (ny.log || []).slice(-150);
      try{
        st.data = await lagreData(ny, basis ? basis.rev : 0);
        if(melding) toast(melding);
        return true;
      }catch(e){
        if(e && e.stale){ st.data = e.data; continue; }
        throw e;
      }
    }
    toast(t('saveRace'));
  }catch(e){
    toast(t('saveFail'));
  }finally{
    st.lagrer = false; visLagrer(false); render();
  }
  return false;
}

/* ---------- Neighborhood requests ----------
   All groups on the server share one request board. Matching happens
   server-side on postal-code centroids; the origin group is never revealed. */
async function fetchReq(){
  if(Lager.mode !== 'server' || !Lager.gid) return false;
  var r = await api('api/groups/' + Lager.gid + '/requests', {headers: pinHeader()});
  if(r.ok && r.body){
    var neste = {mine: r.body.mine || [], nearby: r.body.nearby || []};
    var endret = JSON.stringify(neste) !== JSON.stringify(st.req);
    st.req = neste;
    return endret;
  }
  return false;
}
function megPerson(){
  var meg = hentMeg();
  return meg && st.data ? (st.data.people || []).find(function(p){ return p.id === meg; }) : null;
}
function fornavn(navn){ return String(navn || '').trim().split(/\s+/)[0]; }
function gyldigPostnr(nr){ return /^\d{4}$/.test(String(nr || '').trim()); }

H.backup = function(){
  if(!st.data) return;
  var blob = new Blob([JSON.stringify(st.data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (CONFIG.storageKey || 'backup') + '-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();

};
H.importBackup = function(inp){
  var fil = inp.files && inp.files[0];
  if(!fil) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data || !Array.isArray(data.people) || !Array.isArray(data.tools)){
        toast(t('backupBad'));
        return;
      }
      if(!confirm(t('restoreAsk'))) return;
      // Preserve log array if missing in backup
      if(!Array.isArray(data.log)) data.log = [];
      data.v = data.v || 1;
      // Use endre-style write so concurrent rev is handled
      endre(function(){ return data; }, t('restoreDone'));
    }catch(err){
      toast(t('fileFail'));
    }
    inp.value = '';
  };
  reader.readAsText(fil);
};

H.openGroup = async function(){
  if(st.lagrer) return;
  var inp = $('#land-pin');
  var pin = inp ? inp.value.trim() : '';
  if(pin.length < 4 || pin.length > 32){ st.landingError = t('pinLength'); render(); return; }
  st.lagrer = true; visLagrer(true);
  var r = await api('api/groups/open', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pin: pin})
  });
  st.lagrer = false; visLagrer(false);
  if(r.ok && r.body && r.body.id){
    setGroup(r.body.id, pin);
    st.data = r.body.data;
    st.landing = false; st.landingError = '';
    render();
    return;
  }
  st.landingError = (r.status === 404) ? t('pinNotFound') : t('serverDown');
  render();
};
H.switchGroup = function(){
  if(!confirm(t('switchGroupAsk'))) return;
  leaveGroup();
  st.data = null; st.selected = {}; st.modal = null; st.visning = 'verktoy';
  st.landing = true; st.landingError = '';
  render();
};

H.oStart = function(){
  var rader = st.oppsett.filter(function(r){ return r.name.trim(); });
  if(rader.length < 2) return;
  var people = rader.map(function(r, i){
    return { id:uid(), name:r.name.trim(), address:r.address.trim(), color:FARGER[i % FARGER.length] };
  });
  var pinEl = $('#setup-pin');
  var pin = pinEl ? pinEl.value.trim() : (st.setupPin || '');
  var d = { v:1, people:people, tools:[], log:[], settings:{} };
  people.forEach(function(p){ leggLogg(d, {t:'pers', name:p.name}); });

  // On a server the PIN is the key to the group: required, and unique.
  if(Lager.mode === 'server'){
    if(pin.length < 4 || pin.length > 32){ st.landingError = t('pinLength'); render(); return; }
    st.lagrer = true; visLagrer(true);
    api('api/groups', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin: pin, data: d})
    }).then(function(r){
      st.lagrer = false; visLagrer(false);
      if(r.ok && r.body && r.body.id){
        setGroup(r.body.id, pin);
        st.data = r.body.data;
        st.oppsett = null; st.setupPin = ''; st.landingError = '';
        render();
        return;
      }
      // Keep the form filled in so only the PIN has to be changed
      st.landingError = (r.status === 409) ? t('pinTaken')
                     : (r.status === 400) ? t('pinLength') : t('serverDown');
      render();
      var p = $('#setup-pin');
      if(p){ p.value = ''; p.focus(); }
    });
    return;
  }

  if(pin) d.settings.pin = pin;
  if(CONFIG.pin) d.settings.pin = String(CONFIG.pin);
  st.lagrer = true;
  lagreData(d, 0).then(function(lagret){
    st.data = lagret; st.oppsett = null; st.lagrer = false;
    if(pin || CONFIG.pin) setPinOk(true);
    render();
  }).catch(function(){
    st.lagrer = false; render(); toast(t('saveFail'));
  });
};

H.forhandsvisBilde = function(inp){
  var fil = inp.files && inp.files[0];
  if(!fil) return;
  var leser = new FileReader();
  leser.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maks = 280;
      var w = img.width, h = img.height;
      if(w > maks || h > maks){
        if(w > h){ h = Math.round(h * maks / w); w = maks; }
        else { w = Math.round(w * maks / h); h = maks; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var data = canvas.toDataURL('image/jpeg', 0.65);
      st._tempImg = data;
      st._removeImg = false;
      var prev = $('#f-img-preview');
      if(prev){ prev.src = data; prev.hidden = false; prev.style.display = 'block'; }
      var fj = $('#f-img-fjern');
      if(fj) fj.hidden = false;
    };
    img.src = e.target.result;
  };
  leser.readAsDataURL(fil);
};
H.fjernBilde = function(){
  st._tempImg = null;
  st._removeImg = true;
  var prev = $('#f-img-preview');
  if(prev){ prev.removeAttribute('src'); prev.hidden = true; }
  var inp = $('#f-img');

H.lagreVerktoy = function(){
  var navn = $('#f-navn').value.trim();
  var type = $('#f-type').value;
  var eier = $('#f-eier').value;
  var notat = $('#f-notat').value.trim();
  if(!navn || !eier) return;
  var id = st.modal.id;
  var bilde = st._tempImg || null;
  var fjernBilde = !!st._removeImg;
  st._tempImg = null;
  st._removeImg = false;
  st.modal = null;
  if(!id){
    endre(function(d){
      var tool = { id:uid(), name:navn, type:type, ownerId:eier, holderId:eier,
                   notes:notat, since:naaISO(), created:naaISO() };
      if(bilde) tool.img = bilde;
      d.tools.push(tool);
      leggLogg(d, {t:'ny', tool:navn, toolId:tool.id, by:hentMeg(), to:eier});
      return d;
    }, '«' + navn + '» er lagt til');
  }else{
    endre(function(d){
      var t = d.tools.find(function(x){ return x.id === id; });
      if(t){
        var gmlEier = t.ownerId;
        t.name = navn; t.type = type; t.ownerId = eier; t.notes = notat;
        if(bilde) t.img = bilde;
        if(fjernBilde) delete t.img;
        if(t.holderId === gmlEier && eier !== gmlEier) t.holderId = eier;
      }
      return d;
    }, t('saved'));
  }
};

/* Hand a tool over. Clears any reservation the new holder had, and carries
   the agreed return date (read from the loan sheet) onto every tool. */
function utlaan(d, ids, pid, due, ext){
  ids.forEach(function(id){
    var vt = d.tools.find(function(x){ return x.id === id; });
    if(!vt || (vt.holderId === pid && !ext)) return;
    leggLogg(d, {t:'laan', tool:vt.name, toolId:vt.id, from:vt.holderId,
                 to:pid, extName: ext ? ext.name : null});
    vt.holderId = pid;
    vt.since = naaISO();
    if(ext) vt.ext = ext; else delete vt.ext;
    if(due) vt.due = due; else delete vt.due;
    vt.queue = (vt.queue || []).filter(function(q){ return q.personId !== pid; });
  });
  return d;
}

/* CSV parser: quotes, escaped quotes, CRLF, BOM. Delimiter , or ; (Excel nb-NO uses ;) */
function parseCsv(text){
  text = String(text == null ? '' : text);
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var nl = text.indexOf('\n');
  var firstLine = nl === -1 ? text : text.slice(0, nl);
  var delim = (firstLine.indexOf(';') > -1 && firstLine.indexOf(',') === -1) ? ';' : ',';
  var rows = [], row = [], cell = '', inQuotes = false;
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else inQuotes = false;
      }else cell += c;
    }else if(c === '"'){ inQuotes = true; }
    else if(c === delim){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r'){ cell += c; }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){
    return r.some(function(x){ return String(x).trim() !== ''; });
  });
}
H.importCsv = function(inp){
  var file = inp.files && inp.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    inp.value = '';
    var rows = parseCsv(e.target.result);
    if(!rows.length){ toast(st.lang==='en' ? 'Empty CSV file' : 'Tom CSV-fil'); return; }

    // Column mapping: header row (English or Norwegian) or positional (export order)
    var alias = { name:['name','navn','verktøy','verktoy'], type:['type','kategori'],
                  owner:['owner','eier'], holder:['holder','låner','laner'],
                  status:['status'], since:['since','siden','dato'],
                  due:['due','frist','retur'], notes:['notes','notat','notater'] };
    var header = rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    var col = {};
    var hasHeader = header.indexOf('name') > -1 || header.indexOf('navn') > -1;
    Object.keys(alias).forEach(function(k, idx){
      if(hasHeader){
        col[k] = -1;
        alias[k].forEach(function(a){ if(col[k] === -1) col[k] = header.indexOf(a); });
      }else col[k] = idx;
    });
    if(hasHeader) rows = rows.slice(1);
    var field = function(r, k){
      var i = col[k];
      return (i > -1 && r[i] != null) ? String(r[i]).trim() : '';
    };

    var valid = rows.filter(function(r){ return field(r, 'name'); });
    if(!valid.length){
      toast(st.lang==='en' ? 'No tools found in file' : 'Fant ingen verktøy i filen');
      return;
    }
    var question = st.lang==='en'
      ? 'Import ' + valid.length + ' tools from «' + file.name + '»? They are added to the existing list; rows matching an existing tool (same name and owner) are skipped.'
      : 'Importere ' + valid.length + ' verktøy fra «' + file.name + '»? De legges til i eksisterende liste; rader som matcher et verktøy som finnes fra før (samme navn og eier), hoppes over.';
    if(!confirm(question)) return;

    var added = 0, skipped = 0;
    endre(function(d){
      var peopleByName = {};
      d.people.forEach(function(p){ peopleByName[p.name.trim().toLowerCase()] = p; });
      var findOrAddPerson = function(name){
        if(!name) return null;
        var key = name.trim().toLowerCase();
        if(peopleByName[key]) return peopleByName[key];
        var p = { id:uid(), name:name.trim(), address:'', color:FARGER[d.people.length % FARGER.length] };
        d.people.push(p);
        peopleByName[key] = p;
        leggLogg(d, {t:'pers', name:p.name});
        return p;
      };
      added = 0; skipped = 0;
      valid.forEach(function(r){
        var name = field(r, 'name');
        var owner = findOrAddPerson(field(r, 'owner')) ||
                    (hentMeg() && d.people.find(function(p){ return p.id === hentMeg(); })) ||
                    d.people[0];
        if(!owner){ skipped++; return; }
        var duplicate = d.tools.some(function(x){
          return x.name.trim().toLowerCase() === name.toLowerCase() && x.ownerId === owner.id;
        });
        if(duplicate){ skipped++; return; }
        var funnet = typeFinn(field(r, 'type'));
        var type = funnet ? funnet.k : 'other';
        var holder = findOrAddPerson(field(r, 'holder'));
        var since = field(r, 'since');
        if(!since || isNaN(Date.parse(since))) since = naaISO();
        else since = new Date(since).toISOString();
        var due = field(r, 'due');
        if(!/^\d{4}-\d{2}-\d{2}$/.test(due)) due = '';
        d.tools.push({ id:uid(), name:name, type:type, ownerId:owner.id,
                       holderId:(holder || owner).id, notes:field(r, 'notes'),
                       since:since, due:due, created:naaISO() });
        added++;
      });
      return d;
    }).then(function(ok){
      if(ok) toast(st.lang==='en'
        ? added + ' tools imported' + (skipped ? ', ' + skipped + ' skipped' : '')
        : added + ' verktøy importert' + (skipped ? ', ' + skipped + ' hoppet over' : ''));
    });
  };
  reader.readAsText(file);
};

H.nyEttersp = function(){

  render();

H.reqScope = function(v){
  var boks = $('#r-hood');
  if(boks) boks.hidden = v !== 'hood';
};
H.lagreEttersp = async function(){
  var txt = $('#r-text').value.trim();
  if(!txt) return;
  var megP = megPerson();
  if(!megP) return;
  var megId = megP.id;
  var hood = Lager.mode === 'server' && !$('#r-hood').hidden;

  if(hood){
    var radius = parseInt(($('#r-radius') || {}).value, 10) || 10;
    var postnr = gyldigPostnr(megP.postnr) ? megP.postnr : (($('#r-postnr') || {}).value || '').trim();
    if(!gyldigPostnr(postnr)){ toast(t('unknownPostnr')); return; }
    st.lagrer = true; visLagrer(true);
    var r = await api('api/groups/' + Lager.gid + '/requests', {
      method:'POST', headers: pinHeader({'Content-Type':'application/json'}),
      body: JSON.stringify({text: txt, name: fornavn(megP.name), postnr: postnr, radiusKm: radius})
    });
    st.lagrer = false; visLagrer(false);
    if(!r.ok || !r.body || !r.body.request){
      toast(r.body && r.body.error === 'unknown postnr' ? t('unknownPostnr') : t('serverDown'));
      return;   // keep the sheet open so the input can be fixed
    }
    var xid = r.body.request.id;
    st.modal = null;
    endre(function(d){
      var p = d.people.find(function(x){ return x.id === megId; });
      if(p && !gyldigPostnr(p.postnr)) p.postnr = postnr;
      d.requests = d.requests || [];
      d.requests.push({id: uid(), xid: xid, text: txt, byId: megId,
                       scope:'hood', radiusKm: radius, created: naaISO()});
      leggLogg(d, {t:'ettersp', by: megId, text: txt});
      return d;
    }, t('reqSaved')).then(function(){ fetchReq().then(function(){ render(); }); });
    return;
  }

  st.modal = null;
  endre(function(d){
    d.requests = d.requests || [];
    d.requests.push({id: uid(), xid: null, text: txt, byId: megId,
                     scope:'group', created: naaISO()});
    leggLogg(d, {t:'ettersp', by: megId, text: txt});
    return d;
  }, t('reqSaved'));
};

  st.modal = {type:'ettersvar', id: rid};
  render();
};
H.sendSvar = async function(){
  var m = st.modal;
  if(!m || m.type !== 'ettersvar') return;
  var note = $('#s-note').value.trim();
  if(!note) return;
  var megP = megPerson();
  if(!megP) return;
  var postnr = gyldigPostnr(megP.postnr) ? megP.postnr : (($('#s-postnr') || {}).value || '').trim();
  if(!gyldigPostnr(postnr)){ toast(t('unknownPostnr')); return; }
  st.lagrer = true; visLagrer(true);
  var verktoy = (($('#s-tool') || {}).value || '').trim();
  var r = await api('api/groups/' + Lager.gid + '/requests/' + m.id + '/respond', {
    method:'POST', headers: pinHeader({'Content-Type':'application/json'}),
    body: JSON.stringify({note: note, name: fornavn(megP.name), postnr: postnr, tool: verktoy})
  });
  st.lagrer = false; visLagrer(false);
  if(!r.ok){
    var feil = r.body && r.body.error;
    toast(feil === 'unknown postnr' ? t('unknownPostnr')
        : feil === 'full' ? t('respFull') : t('serverDown'));
    return;
  }
  st.modal = null;
  var megId = megP.id;
  if(!gyldigPostnr(megP.postnr)){
    endre(function(d){
      var p = d.people.find(function(x){ return x.id === megId; });
      if(p) p.postnr = postnr;
      return d;
    });
  }
  toast(t('replySent'));
  fetchReq().then(function(){ render(); });
};
H.lukkEttersp = function(id){
  if(st.bekreft !== 'r' + id){ st.bekreft = 'r' + id; render(); return; }
  st.bekreft = null;
  var r = ((st.data || {}).requests || []).find(function(x){ return x.id === id; });
  if(r && r.xid && Lager.mode === 'server'){
    api('api/groups/' + Lager.gid + '/requests/' + r.xid + '/close', {
      method:'POST', headers: pinHeader()
    }).then(function(){ fetchReq().then(function(){ render(); }); });
  }
  endre(function(d){
    d.requests = (d.requests || []).filter(function(x){ return x.id !== id; });
    return d;
  }, t('reqClosed'));
};

      leggLogg(d, {t:'pers', name:n});
      return d;
    }, tf('addedName', n));

    endre(function(d){
      var p = d.people.find(function(x){ return x.id === id; });
      if(p){ p.name = n; p.address = a; p.postnr = nr; }
      return d;

H.slettPerson = function(id){
  if(st.bekreft !== 'p' + id){ st.bekreft = 'p' + id; render(); return; }
  st.modal = null; st.bekreft = null;
  endre(function(d){
    d.people = d.people.filter(function(p){ return p.id !== id; });
    // Drop any reservations they were holding, so no queue points at a ghost
    (d.tools || []).forEach(function(v){
      if(v.queue) v.queue = v.queue.filter(function(q){ return q.personId !== id; });
    });
    return d;
  }, t('personRemoved'));
};

    pinOk = p.length >= 4 && p.length <= 32;  // the PIN is the key to the group
  }
  k.disabled = antall < 2 || !pinOk;
}

/* ----- Tools tab ----- */
function dagerSiden(iso){
  try{
    var d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if(d < 1) return t('today');
    if(d === 1) return t('day1');
    return d + ' ' + t('days');
  }catch(e){ return ''; }
}
function antallDager(iso){
  try{ return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
  catch(e){ return 0; }
}
/* Whole days from today to a 'YYYY-MM-DD' date. Negative = overdue. */
function dagerTil(ymd){
  if(!ymd) return null;
  var d = new Date(ymd + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  var i = new Date();
  i.setHours(0, 0, 0, 0);
  return Math.round((d.getTime() - i.getTime()) / 86400000);
}
/* Due-date label, or '' when there is nothing worth saying */
function forfallTekst(ymd){
  var n = dagerTil(ymd);
  if(n === null) return '';
  if(n < 0) return Math.abs(n) + ' ' + t('days') + ' ' + t('overdue');
  if(n === 0) return t('dueToday');
  if(n === 1) return t('dueTomorrow');
  return t('dueIn') + ' ' + n + ' ' + t('days');
}
/* Name of whoever holds the tool now – a member, or an outside borrower */
function holderNavn(v, byId){
  if(v.holderId === EXT) return (v.ext && v.ext.name) || t('extTag');
  var p = byId[v.holderId];
  return p ? p.name : '?';
}
function erHjemme(v){ return v.holderId === v.ownerId; }
/* Tools I hold that are due within a day (or already overdue) */
function forfallListe(){
  var meg = hentMeg();
  if(!meg || !st.data) return [];
  return (st.data.tools || []).filter(function(v){
    if(v.holderId !== meg || erHjemme(v) || !v.due) return false;
    var n = dagerTil(v.due);
    return n !== null && n <= 1;
  });
}

function visListe(){
  var boks = $('#liste');
  if(!boks || !st.data) return;
  var byId = personKart();
  var tools = st.data.tools || [];
  var q = st.sok.trim().toLowerCase();
  var meg = hentMeg();
  var liste = tools.filter(function(t){
    if(q && ((t.name + ' ' + typeNavn(t.type) + ' ' + (t.notes || '')).toLowerCase().indexOf(q) === -1)) return false;
    if(st.filter === 'hjemme') return t.holderId === t.ownerId;
    if(st.filter === 'ute') return t.holderId !== t.ownerId;
    if(st.filter === 'mine') return meg && t.holderId === meg && t.ownerId !== meg;
    if(st.filter.indexOf('p:') === 0) return t.ownerId === st.filter.slice(2);
    return true;
  }).sort(function(a, b){ return a.name.localeCompare(b.name, st.lang==='en'?'en':'nb'); });

  if(tools.length === 0){
    boks.innerHTML = '<div class="vb-empty"><div class="vb-empty-ico">' + ikon('skru',26) +
      '</div><p><b>' + esc(t('noTools')) + '</b><br>' + esc(t('noToolsHint')) + '</p>' +
      '<button class="vb-btn vb-primary vb-small" onclick="H.nytt()">' + esc(t('newTool')) + '</button></div>';
    return;
  }
  if(liste.length === 0){
    boks.innerHTML = '<div class="vb-empty"><div class="vb-empty-ico">' + ikon('skru',26) +

      '<button class="vb-btn vb-ghost vb-small" onclick="H.setFilter(\'alle\'); st.sok=\'\'; render();">' +
      esc(t('showAll')) + '</button></div>';
    return;
  }

  var longDays = CONFIG.longLoanDays || 14;
  boks.innerHTML = '<div class="vb-list grid">' + liste.map(function(v){
    var eier = byId[v.ownerId];
    var hjemme = erHjemme(v);
    var dager = antallDager(v.since);
    var lenge = !hjemme && dager >= longDays;
    var ekstern = v.holderId === EXT;

      ? t('home') + ' · ' + esc(eier ? eier.name : '?')
      : esc(holderNavn(v, byId)) + ' · ' + dagerSiden(v.since) +
        (lenge ? ' · ' + t('longLoan') : '');

    // Agreed return date gets its own tag so it reads before the loan age
    var forfall = !hjemme ? forfallTekst(v.due) : '';

      ? '<span class="vb-tagg ' + (forsent ? 'lenge' : 'frist') + '">' + esc(forfall) + '</span>'
      : '';
    var eksternTag = ekstern
      ? '<span class="vb-tagg ekstern">' + esc(t('extTag')) + '</span>' : '';

    var kø = v.queue || [];
    var minKø = meg && kø.some(function(q){ return q.personId === meg; });
    var køLinje = kø.length
      ? '<div class="vb-queue">' + ikon('klokke',13) + ' ' + kø.length + ' ' + esc(t('inQueue')) + ': ' +
          kø.map(function(q){
            var p = byId[q.personId];

      : '';

    var sel = !!st.selected[v.id];

      if(neste){
        handling = '<button class="vb-btn vb-primary vb-small" onclick="H.laanTilNeste(\'' + v.id + '\',\'' +
          kø[0].personId + '\')">' + esc(t('loanToNext') + ' ' + neste.name) + '</button>';
      }else{
        handling = '<button class="vb-btn vb-primary vb-small" onclick="H.laan(\'' + v.id + '\')">' + esc(t('loanOut')) + '</button>';
      }
      if(meg && v.holderId !== meg){
        handling += '<button class="vb-btn vb-ghost vb-small" onclick="H.laanTilMeg(\'' + v.id + '\')">' + esc(t('loanToMe')) + '</button>';
      }

      if(meg && v.holderId !== meg){
        handling += minKø
          ? '<button class="vb-btn vb-ghost vb-small" onclick="H.avreserver(\'' + v.id + '\')">' +

      ? '<img class="vb-toolimg" src="' + esc(v.img) + '" alt="">'
      : '<div class="vb-toolimg" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">' +
          ikon('skru',22) + '</div>';
    return '<article class="vb-card">' +
      '<div class="vb-toolrow">' +
        '<button class="vb-check' + (sel?' on':'') + '" aria-label="Select" onclick="H.toggleSel(\'' + v.id + '\')">' +
          (sel ? '✓' : '') + '</button>' +
        '<div class="vb-toolleft">' + bilde +
          '<div style="min-width:0"><h3 class="vb-toolname">' + esc(v.name) + '</h3>' +

        status + '</span>' + forfallTag + eksternTag + '</div>' +
      køLinje +
      (ekstern && v.ext && v.ext.note ? '<p class="vb-notes">' + esc(v.ext.note) + '</p>' : '') +

          ikon('blyant',17) + '</button>' +

/* A sheet that fails to build must not take the app down with it: without
   this, the exception escapes render(), #app is never reassigned, and every
   later render throws again on the same modal – the app looks frozen and only
   a reload helps. Drop the sheet, keep the app alive, and say so. */
function trygtModal(byId, megGyldig){
  try{
    return htmlModal(byId, megGyldig);
  }catch(e){
    if(window.console && console.error) console.error('modal', e);
    st.modal = null;
    setTimeout(function(){ toast(t('sheetFail')); }, 0);
    return '';
  }
}

function htmlModal(byId, megGyldig){
  var people = st.data.people || [];
  var tools = st.data.tools || [];
  var m = st.modal;

  // Must pick identity first
  if(!megGyldig && people.length > 0 && (!m || m.type !== 'byttmeg')) m = {type:'byttmeg', tvang:true};

  if(!m) return '';

  if(m.type === 'byttmeg'){
    var valg = people.map(function(p){
      return '<button class="vb-pick" onclick="H.velgMeg(\'' + p.id + '\')">' + sw(p.color) +
        '<span class="vb-pick-name">' + esc(p.name) + '</span>' +
        (p.address ? '<span class="vb-pick-addr">' + esc(p.address) + '</span>' : '') + '</button>';
    }).join('');
    var leggTil = m.leggTil
      ? '<div class="vb-mt">' +
          felt(esc(t('name')), '<input class="vb-inp" id="m-navn">') +
          felt(esc(t('address')), '<input class="vb-inp" id="m-adr">') +
          '<button class="vb-btn vb-primary" onclick="H.leggMegTil()">' + esc(t('addAndPick')) + '</button>' +
        '</div>'
      : '<button class="vb-btn vb-ghost vb-mt" onclick="H.visLeggMeg()">' + esc(t('notOnList')) + '</button>';
    return ark(esc(t('whoAreYou')),
      '<p class="vb-muted vb-mb">' + esc(t('pickPersonLong')) + '</p>' +
      '<div class="vb-pickgrid">' + valg + '</div>' + leggTil,
      !m.tvang);
  }

  if(m.type === 'verktoy'){
    // Named vt, not t: a "var t" here would shadow the i18n function t()
    // for the whole of htmlModal (var hoisting) and break the other sheets.
    var vt = m.id ? tools.find(function(x){ return x.id === m.id; }) : null;
    if(m.id && !vt) return '';
    var meg = hentMeg();
    var valgtEier = vt ? vt.ownerId : (megGyldig ? meg : (people[0] && people[0].id));
    var valgtType = (typeFinn(vt ? vt.type : '') || TYPER[0]).k;
    var typeValg = TYPER.map(function(x){
      return '<option value="' + esc(x.k) + '"' + (valgtType === x.k ? ' selected' : '') + '>' +
        esc(x[st.lang === 'en' ? 'en' : 'nb']) + '</option>';
    }).join('');
    var eierValg = people.map(function(p){
      return '<option value="' + p.id + '"' + (valgtEier === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
    var slett = vt
      ? '<button class="vb-btn vb-dangertxt' + (st.bekreft === 'v' + vt.id ? ' bekreft' : '') +
          '" onclick="H.slettVerktoy(\'' + vt.id + '\')">' +
          esc(st.bekreft === 'v' + vt.id ? t('tapDelete') : t('deleteTool')) + '</button>'
      : '';
    var bildePreview = vt && vt.img
      ? '<img id="f-img-preview" src="' + esc(vt.img) + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:6px;display:block">'
      : '<img id="f-img-preview" hidden style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:6px;display:block">';
    var bildeFjern = (vt && vt.img) || st._tempImg
      ? '<button type="button" class="vb-btn vb-ghost vb-small" style="margin-top:6px" onclick="H.fjernBilde()">' + esc(t('photoRemove')) + '</button>'
      : '<button type="button" id="f-img-fjern" class="vb-btn vb-ghost vb-small" style="margin-top:6px" hidden onclick="H.fjernBilde()">' + esc(t('photoRemove')) + '</button>';
    return ark(esc(vt ? t('editTool') : t('newTool')),
      felt(esc(t('toolName')), '<input class="vb-inp" id="f-navn" placeholder="' + esc(t('toolNamePh')) +
        '" value="' + esc(vt ? vt.name : '') + '">') +
      felt(esc(t('typeLbl')), '<select class="vb-inp" id="f-type">' + typeValg + '</select>') +
      felt(esc(t('owner')), '<select class="vb-inp" id="f-eier">' + eierValg + '</select>') +
      felt(esc(t('photoLbl')), '<input type="file" id="f-img" accept="image/*" class="vb-inp" onchange="H.forhandsvisBilde(this)">' + bildePreview + bildeFjern) +
      felt(esc(t('notesLbl')), '<textarea class="vb-inp" id="f-notat" rows="2" ' +
        'placeholder="' + esc(t('notesPh')) + '">' + esc(vt ? vt.notes : '') + '</textarea>') +
      '<div class="vb-sheet-actions">' +
        '<button class="vb-btn vb-primary" onclick="H.lagreVerktoy()">' + esc(t('save')) + '</button>' + slett +
      '</div>');
  }

  if(m.type === 'laan'){
    var ids = m.ids || (m.id ? [m.id] : []);
    var tls = tools.filter(function(x){ return ids.indexOf(x.id) >= 0; });
    if(!tls.length) return '';
    var exclude = tls.length === 1 ? tls[0].holderId : null;
    var andre = people.filter(function(p){ return p.id !== exclude; });
    var title = tls.length === 1
      ? tf('whoGets', tls[0].name)
      : tf('loanMany', tls.length);
    var knapper = andre.length
      ? andre.map(function(p){
          return '<button class="vb-pick" onclick="H.velgLaaner(null,\'' + p.id + '\')">' + sw(p.color) +
            '<span class="vb-pick-name">' + esc(p.name) + '</span>' +
            (p.address ? '<span class="vb-pick-addr">' + esc(p.address) + '</span>' : '') + '</button>';
        }).join('')
      : '<p class="vb-muted">' + esc(t('noOthers')) + '</p>';
    return ark(esc(title),
      '<p class="vb-muted vb-mb">' + esc(t('toolsMove')) + '</p>' +
      (tls.length > 1 ? '<p class="vb-notes vb-mb">' + tls.map(function(x){ return esc(x.name); }).join(', ') + '</p>' : '') +
      felt(esc(t('due')), '<input class="vb-inp" id="l-due" type="date" min="' +
        new Date().toISOString().slice(0,10) + '">') +
      '<p class="vb-finetext" style="margin-top:-6px">' + esc(t('dueHint')) + '</p>' +
      '<div id="l-pick" class="vb-mt">' +
        '<div class="vb-pickgrid">' + knapper + '</div>' +
        '<button class="vb-btn vb-ghost vb-mt" onclick="H.visEksternt()">' +
          ikon('pin',16) + ' ' + esc(t('extLoan')) + '</button>' +
      '</div>' +
      '<div id="l-ext" hidden class="vb-mt">' +
        '<p class="vb-finetext" style="margin-top:0">' + esc(t('extLoanHint')) + '</p>' +
        felt(esc(t('extName')), '<input class="vb-inp" id="l-extnavn" maxlength="60" placeholder="' +
          esc(t('extNamePh')) + '">') +
        felt(esc(t('extNote')), '<textarea class="vb-inp" id="l-extnotat" rows="2" maxlength="300" placeholder="' +
          esc(t('extNotePh')) + '"></textarea>') +
        '<button class="vb-btn vb-primary" onclick="H.laanUtEksternt()">' + esc(t('extRegister')) + '</button>' +
      '</div>');
  }

  if(m.type === 'historikk'){
    var th = tools.find(function(x){ return x.id === m.id; });
    if(!th) return '';
    var rows = (st.data.log || []).filter(function(e){
      return e.toolId === th.id || e.tool === th.name;
    }).slice().reverse();
    var n2 = function(id, e){
      if(id === EXT) return esc((e && e.extName) || t('extTag'));
      var p = byId[id];
      return esc(p ? p.name : '?');
    };
    var body = rows.length === 0
      ? '<p class="vb-muted">' + esc(t('noHistory')) + '</p>'
      : '<div class="vb-hist">' + rows.map(function(e){
          var tekst = '';
          if(e.t === 'ny') tekst = esc(t('addedShort'));
          if(e.t === 'laan') tekst = n2(e.from, e) + ' → ' + n2(e.to, e);
          if(e.t === 'retur') tekst = (st.lang==='en'?'Returned to ':'Tilbake til ') + n2(e.to, e);
          if(e.t === 'slett') tekst = esc(t('deleted'));
          return '<div class="vb-hist-row"><span>' + tekst + '</span><span class="vb-logdate">' + fmtDato(e.date) + '</span></div>';
        }).join('') + '</div>';
    return ark(esc(t('history')) + ' – ' + esc(th.name), body);
  }

  if(m.type === 'ettersp'){
    var megP = megPerson();
    var harNr = megP && gyldigPostnr(megP.postnr);
    var radiusValg = [5, 10, 25, 50].map(function(km){
      return '<option value="' + km + '"' + (km === 10 ? ' selected' : '') + '>' + km + ' km</option>';
    }).join('');
    var hoodBoks = '';
    if(Lager.mode === 'server'){
      hoodBoks =
        felt(esc(t('reqScope')),
          '<div class="vb-radios">' +
            '<label><input type="radio" name="r-scope" value="group" checked onchange="H.reqScope(this.value)"> ' +
              esc(t('reqScopeGroup')) + '</label>' +
            '<label><input type="radio" name="r-scope" value="hood" onchange="H.reqScope(this.value)"> ' +
              esc(t('reqScopeHood')) + '</label>' +
          '</div>') +
        '<p class="vb-finetext" style="margin-top:-6px">' + esc(t('reqScopeHint')) + '</p>' +
        '<div id="r-hood" hidden class="vb-mt">' +
          felt(esc(t('reqRadius')), '<select class="vb-inp" id="r-radius">' + radiusValg + '</select>') +
          (harNr
            ? '<p class="vb-muted vb-mb">' + esc(t('reqFrom')) + ': <b>' +
                esc((megP.address ? megP.address + ', ' : '') + megP.postnr) + '</b> (' + esc(t('reqFromEdit')) + ')</p>'
            : felt(esc(t('postnr')), '<input class="vb-inp" id="r-postnr" inputmode="numeric" maxlength="4" placeholder="4630">') +
              '<p class="vb-finetext" style="margin-top:-6px">' + esc(t('reqNeedPostnr')) + '</p>') +
          '<p class="vb-finetext"><b>' + esc(t('reqPickup')) + '</b> ' + esc(t('reqPrivacy')) + '</p>' +
        '</div>';
    }
    return ark(esc(t('newReq')),
      felt(esc(t('reqWhat')), '<textarea class="vb-inp" id="r-text" rows="2" maxlength="280" placeholder="' +
        esc(t('reqPh')) + '"></textarea>') +
      hoodBoks +
      '<div class="vb-sheet-actions">' +
        '<button class="vb-btn vb-primary" onclick="H.lagreEttersp()">' + esc(t('publish')) + '</button>' +
      '</div>');
  }

  if(m.type === 'ettersvar'){
    var rq = (st.req.nearby || []).find(function(x){ return x.id === m.id; });
    if(!rq) return '';
    var megP2 = megPerson();
    var harNr2 = megP2 && gyldigPostnr(megP2.postnr);
    // Offer the tools that are actually at home right now
    var mine = tools.filter(function(x){ return erHjemme(x); })
      .sort(function(a, b){ return a.name.localeCompare(b.name, st.lang==='en'?'en':'nb'); });
    var toolValg = mine.length
      ? felt(esc(t('respTool')), '<select class="vb-inp" id="s-tool">' +
          '<option value="">' + esc(t('respToolNone')) + '</option>' +
          mine.map(function(x){
            return '<option value="' + esc(x.name) + '">' + esc(x.name) + '</option>';
          }).join('') + '</select>')
      : '';

    return ark(esc(t('canLend')),
      '<p class="vb-muted vb-mb">«' + esc(rq.text) + '» – ' + esc(rq.name) + ' · ' +
        esc(rq.postnr + ' ' + rq.place) + ' · ca. ' + rq.distKm + ' ' + esc(t('kmAway')) + '</p>' +
      '<p class="vb-finetext vb-mb">' + esc(t('respHint')) + '</p>' +
      toolValg +
      felt(esc(t('yourReply')), '<textarea class="vb-inp" id="s-note" rows="3" maxlength="500" placeholder="' +
        esc(t('respPh')) + '"></textarea>') +
      (harNr2 ? '' :
        felt(esc(t('postnr')), '<input class="vb-inp" id="s-postnr" inputmode="numeric" maxlength="4" placeholder="4630">')) +
      '<p class="vb-finetext">' + esc(t('respShared')) + '</p>' +
      '<div class="vb-sheet-actions">' +
        '<button class="vb-btn vb-primary" onclick="H.sendSvar()">' + esc(t('sendReply')) + '</button>' +
      '</div>');
  }

  if(m.type === 'person'){
    var p = m.id ? people.find(function(x){ return x.id === m.id; }) : null;
    if(m.id && !p) return '';
    var harVerktoy = p && tools.some(function(t){ return t.ownerId === p.id || t.holderId === p.id; });
    var slettP = '';
    if(p){
      slettP = harVerktoy
        ? '<button class="vb-btn vb-dangertxt" disabled>' + esc(t('cantRemove')) + '</button>'
        : '<button class="vb-btn vb-dangertxt' + (st.bekreft === 'p' + p.id ? ' bekreft' : '') +
            '" onclick="H.slettPerson(\'' + p.id + '\')">' +
            esc(st.bekreft === 'p' + p.id ? t('tapRemove') : t('removePerson')) + '</button>';
    }
    return ark(esc(p ? t('editPerson') : t('newPerson')),
      felt(esc(t('name')), '<input class="vb-inp" id="p-navn" value="' + esc(p ? p.name : '') + '">') +
      felt(esc(t('address')), '<input class="vb-inp" id="p-adr" placeholder="' + esc(t('addressPh')) +
        '" value="' + esc(p ? p.address : '') + '">') +
      felt(esc(t('postnr')), '<input class="vb-inp" id="p-postnr" inputmode="numeric" maxlength="4" ' +
        'placeholder="4630" value="' + esc(p && p.postnr ? p.postnr : '') + '">') +
      '<p class="vb-finetext" style="margin-top:-6px">' + esc(t('reqPrivacy')) + '</p>' +
      '<div class="vb-sheet-actions">' +
        '<button class="vb-btn vb-primary" onclick="H.lagrePerson()">' + esc(t('save')) + '</button>' + slettP +
      '</div>');
  }

  return '';
}

/* After every render: fill the tools list + focus management */
var _render = render;
render = function(){
  var active = document.activeElement;
  var wasModal = !!st.modal;
  _render();
  visToast();   // survives the DOM rebuild
  if(st.data && st.visning === 'verktoy') visListe();
  if(st.modal){
    var sheet = document.querySelector('.vb-sheet');
    if(sheet){
      if(!st._focusBack) st._focusBack = active;
      var focusable = sheet.querySelector('input, select, textarea, button');
      if(focusable) focusable.focus();
      else sheet.focus();
    }
  }
  // Disable interactive controls while saving
  if(st.lagrer){
    document.querySelectorAll('.vb-btn, .vb-fab').forEach(function(b){
      b.setAttribute('aria-busy', 'true');
    });
  }
};

/* ---------- Boot ---------- */
(async function(){
  document.title = CONFIG.name;
  try{
    // An explicit NO/EN choice always beats what the browser asked for
    var savedLang = localStorage.getItem(CONFIG.storageKey+':lang');
    if(savedLang === 'nb' || savedLang === 'en') st.lang = savedLang;
  }catch(e){}
  document.documentElement.lang = st.lang === 'en' ? 'en' : 'nb';
  // The boot screen is static markup, so translate it before the first await
  var bootTekst = document.querySelector('#app .vb-muted');
  if(bootTekst) bootTekst.textContent = t('loading');

  // Escape closes open modal; simple focus trap inside sheet
  document.addEventListener('keydown', function(e){
    if(!st.modal) return;
    if(e.key === 'Escape' && !st.modal.tvang){
      H.lukk();
      return;
    }
    if(e.key !== 'Tab') return;
    var sheet = document.querySelector('.vb-sheet');
    if(!sheet) return;
    var nodes = sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    var list = Array.prototype.filter.call(nodes, function(n){ return !n.disabled && n.offsetParent !== null; });
    if(!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  // Register service worker for installable PWA shell
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('/sw.js'); }catch(e){}
  }

  st.data = await initLager();
  st.klar = true;
  if(st.data && Lager.mode === 'server')
    fetchReq().then(function(endret){ if(endret) render(); });
  if(!st.data){
    if(Lager.mode === 'server' && !Lager.gid){
      st.landing = true;   // front page: open a group with a PIN, or start a new one
    }else{
      st.oppsett = [{name:'',address:''},{name:'',address:''},{name:'',address:''}];
      st.setupPin = '';
    }
  }
  render();

  // Background refresh (on tab focus + every 25s)
  async function stille(){
    if(st.modal || !st.data || st.lagrer || st.landing) return;
    var d = await hentData();
    if(d === null && Lager.mode === 'server'){
      // Group gone or PIN no longer valid – back to the front page
      leaveGroup();
      st.data = null; st.landing = true; render();
      return;
    }
    var endretData = d && JSON.stringify(d) !== JSON.stringify(st.data);
    if(endretData) st.data = d;
    var endretReq = await fetchReq();
    if(endretData || endretReq) render();
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') stille();
  });
  setInterval(stille, 25000);
})();
</script>
