name: Bug report
description: Something is broken in the app or the server
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A short reproduction beats a long theory.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site (neighbor-tools.com)
        - Self-hosted Docker
        - python3 server.py
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Safari on iPhone, Firefox on Linux, …
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
