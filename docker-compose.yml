services:
  neighbortools:
    build: .
    ports:
      - "8787:8080"
    volumes:
      - neighbortools-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  neighbortools-data:
